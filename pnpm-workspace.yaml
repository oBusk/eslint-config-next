packages:
  - test

configDependencies:
  "@obusk/pnpm-plugin-defaults": ~12.14.0

hoistPattern:
  - "@next/eslint-plugin-next"
  - eslint-plugin-react-hooks

allowBuilds:
  "@parcel/watcher": true
  sharp: false
  simple-git-hooks: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@obusk/pnpm-plugin-defaults"
  - next
  - "@next/*"
  - eslint-config-next

trustPolicyExclude:
  - eslint-import-resolver-typescript@3.10.1
  - semver@6.3.1
