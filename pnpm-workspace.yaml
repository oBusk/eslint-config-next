packages:
  - test

configDependencies:
  "@obusk/pnpm-plugin-defaults": ~12.19.0

hoistPattern: []

allowBuilds:
  "@parcel/watcher": true
  sharp: false
  simple-git-hooks: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - "@obusk/pnpm-plugin-defaults"
  - next
  - "@next/*"
  - eslint-config-next

overrides:
  "minimatch@>=7 <11.0.1": ^11.0.4
  "glob@>=9 <14.0.2": ^14.0.3

auditConfig:
  ignoreGhsas:
    # picomatch: no patched release exists, only reachable through glob patterns from tooling config
    - GHSA-fc5q-39xc-vjpf

trustPolicyExclude:
  - eslint-import-resolver-typescript@3.10.1
