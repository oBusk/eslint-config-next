packages:
  - test

configDependencies:
  "@obusk/pnpm-plugin-defaults": 0.5.6

hoistPattern:
  - "@next/eslint-plugin-next"
  - eslint-plugin-react-hooks

allowBuilds:
  sharp: false
  simple-git-hooks@2.13.1: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - next
  - "@next/*"
  - eslint-config-next

trustPolicyExclude:
  - eslint-import-resolver-typescript@3.10.1
  - semver@6.3.1
  - tailwindcss@3.4.18

overrides:
  postcss@<8.5.10: ^8.5.10
